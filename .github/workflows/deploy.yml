name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for Deno Deploy OIDC — no secret needed
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Caches node_modules keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy SPA server into build output
        run: cp serve.ts dist/happie/browser/serve.ts

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: ${{ vars.PROJECT_NAME }} # Set this in repo Settings → Variables
          entrypoint: serve.ts
          root: dist/happie/browser
